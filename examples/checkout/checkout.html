<style>
/* ===========================================================================
   FLOW_VIZ — flow.css  (v0.6.0)
   Two themes, one structure.
     light  = journal: warm paper, serif prose, hairline rules, no vertical grid
     dark   = traditional: cool slate, sans prose, full grid, soft radii
   Tokens only. Never hard-code a colour in a report.
   draw.css builds the drawing component on these same token names, and on
   [data-kind="drawing"] swaps the neutrals for the canvas/night palette.
   =========================================================================== */

/* ── JOURNAL (light, default) ─────────────────────────────────────────────── */
:root{
  --bg:#f4efe4;
  --paper:#fdfbf5;
  --panel:#faf6ec;
  --panel2:#f2ecdd;
  --sunk:#f0e9d8;
  --line:#ded4bd;
  --line2:#c4b795;
  --rule:#b9282e;              /* notebook margin rule */

  --fg:#2a2622;
  --dim:#645c4e;
  --dim2:#8b8271;

  --acc:#2f5d8f;               /* ink blue */
  --ok:#3c6f4c;                /* ink green */
  --warn:#8a6a1f;              /* ochre */
  --bad:#93372e;               /* oxblood */
  --mag:#6a437a;               /* violet ink */

  --accbg:#eaf0f7; --okbg:#e9f1ea; --warnbg:#f6f0dd; --badbg:#f8ebe7; --magbg:#f1eaf4;

  --f-body:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;

  --f-size:16.5px; --f-lh:1.66;
  --r:4px; --r2:5px;
  --sh:0 1px 2px rgba(70,56,32,.08);
  --grid:0;                    /* table vertical borders off in journal */
  --print-bg:#fff;             /* paper is warm on screen, white on paper */
  --zebra:transparent;         /* journal: hairlines, no stripes */
  --sh-pop:0 4px 18px rgba(0,0,0,.22);
}

/* ── TRADITIONAL DARK ─────────────────────────────────────────────────────── */
[data-theme="dark"]{
  --bg:#0f1115;
  --paper:#161a21;
  --panel:#161a21;
  --panel2:#1c2129;
  --sunk:#0b0e13;
  --line:#2a313d;
  --line2:#3a4453;
  --rule:#3a4453;

  --fg:#dfe5ee;
  --dim:#98a3b3;
  --dim2:#6d7a8c;

  --acc:#6fb3ff;
  --ok:#54c98a;
  --warn:#e8c46a;
  --bad:#ef6f6f;
  --mag:#c58bdf;

  --accbg:#121d2b; --okbg:#12211a; --warnbg:#241f12; --badbg:#241618; --magbg:#1f1728;

  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-size:15px; --f-lh:1.6;
  --r:9px; --r2:7px;
  --sh:0 1px 0 #0a0c10 inset;
  --grid:1px;
  --zebra:#141821;
}

/* ── base ─────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:var(--f-size)/var(--f-lh) var(--f-body);
  padding:24px 28px 80px;max-width:1010px}
p{margin:10px 0}
ul,ol{margin:9px 0;padding-left:23px} li{margin:5px 0}
b,strong{color:var(--fg);font-weight:600}
a{color:var(--acc)}
em{font-style:italic}
h3{font:600 14px/1.4 var(--f-ui);margin:20px 0 7px;color:var(--acc);
  letter-spacing:.3px;text-transform:none}
.in>h3:first-child{margin-top:0}
.in>:first-child{margin-top:0}
.in>:last-child{margin-bottom:0}

code{font:.83em/1.5 var(--f-mono);background:var(--sunk);border:1px solid var(--line);
  border-radius:3px;padding:.5px 4px;color:var(--fg)}
pre{margin:0;font:12.5px/1.6 var(--f-mono);white-space:pre;overflow-x:auto;color:var(--fg)}
pre code{background:none;border:none;padding:0;font-size:12.5px}
.c{color:var(--dim2)}                       /* inline comment inside pre */

/* uppercase micro-label, used for every slot name */
.k{display:block;font:700 10.5px/1.3 var(--f-ui);letter-spacing:1.15px;
  text-transform:uppercase;color:var(--dim2);margin-bottom:3px}

/* ── status pill (fixed, top right) ───────────────────────────────────────── */
.pill{position:fixed;top:12px;right:14px;z-index:60;display:flex;gap:8px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:5px 8px 5px 12px;font:11.5px var(--f-ui);color:var(--dim);box-shadow:var(--sh)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.pill.disk .dot{background:var(--ok)}
.pill.err .dot{background:var(--bad)}
.pill button{background:none;border:1px solid transparent;color:var(--acc);
  font:11.5px var(--f-ui);cursor:pointer;padding:1px 5px;border-radius:4px}
.pill button:hover{border-color:var(--line2)}
.pill .sep{width:1px;height:13px;background:var(--line)}

/* ── LAYER 1 · the card ───────────────────────────────────────────────────── */
.card{position:relative;background:var(--paper);border:1px solid var(--line2);
  border-radius:var(--r);padding:20px 24px 18px;margin:2px 0 6px;box-shadow:var(--sh)}
:root:not([data-theme="dark"]) .card{border-left:3px solid var(--rule);padding-left:26px}
.card .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card h1{font:600 27px/1.22 var(--f-body);margin:0 0 15px;letter-spacing:-.3px;max-width:26ch}
[data-theme="dark"] .card h1{font-size:26px;letter-spacing:-.4px}
:root:not([data-theme="dark"]) .card h1{border-bottom:1px solid var(--line);padding-bottom:12px}

.chip{display:inline-flex;align-items:center;gap:7px;font:700 11px var(--f-ui);
  letter-spacing:.8px;text-transform:uppercase;padding:4px 11px;border-radius:var(--r2);
  border:1px solid var(--line2);color:var(--acc);background:var(--accbg)}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{color:var(--ok);background:var(--okbg)}
.chip.warn{color:var(--warn);background:var(--warnbg)}
.chip.bad{color:var(--bad);background:var(--badbg)}
.meta{margin-left:auto;font:11.5px var(--f-ui);color:var(--dim2)}

.slot{margin:0 0 14px}
.slot .v{font-size:1.02em;line-height:1.56}
.slot.wh .v{color:var(--dim);font-size:.96em}

.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;
  margin:17px 0}
/* direct children only: `.vitals div` also boxed the .n and .l inside each tile */
.vitals>div{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2);
  padding:10px 12px}
.vitals .n{font:600 21px/1.1 var(--f-ui);color:var(--acc);letter-spacing:-.5px}
.vitals .l{font:11px var(--f-ui);color:var(--dim2);text-transform:uppercase;
  letter-spacing:.5px;margin-top:4px}

.next{border-top:1px solid var(--line);padding-top:13px}
.next ol{margin:6px 0 0;padding-left:21px}
.next li{margin:7px 0}

.badge{display:inline-block;font:700 10px var(--f-ui);letter-spacing:.55px;
  padding:1.5px 6px;border-radius:3px;border:1px solid var(--line2);color:var(--dim2);
  margin-left:7px;vertical-align:1.5px;text-transform:uppercase;white-space:nowrap}
.badge.ro{color:var(--ok);background:var(--okbg)}
.badge.w{color:var(--bad);background:var(--badbg)}
.badge.acc{color:var(--acc);background:var(--accbg)}

/* ── LAYER 2 · spine ──────────────────────────────────────────────────────── */
.spine{margin:22px 0 4px}
.dia{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);
  padding:8px 12px;overflow-x:auto}
.dia svg{display:block;margin:0 auto;max-width:100%;height:auto}
.mermaid{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;overflow-x:auto}
/* a drawing as the spine diagram: draw.css styles the component itself */
.spine .fv-drawing{margin:0}

.ctl{display:flex;gap:8px;align-items:center;margin:20px 0 10px;flex-wrap:wrap}
.ctl button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);
  border-radius:var(--r2);font:12px var(--f-ui);padding:5px 12px;cursor:pointer}
.ctl button:hover{color:var(--fg);border-color:var(--acc)}
.ctl .hint{color:var(--dim2);font:11.5px var(--f-ui);margin-left:auto}

details.row{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  margin:9px 0;padding:0 17px}
details.row[open]{background:var(--paper);border-color:var(--line2)}
[data-theme="dark"] details.row[open]{background:var(--panel2)}
details.row>summary{cursor:pointer;padding:13px 0;list-style:none;outline:none;
  display:flex;gap:12px;align-items:baseline}
summary::-webkit-details-marker{display:none}
details.row>summary .ord{font:700 13px var(--f-ui);color:var(--acc);min-width:1.3em;flex:none}
details.row>summary .cl{font-weight:600;flex:1;line-height:1.42}
details.row>summary .rt{font:11.5px var(--f-ui);color:var(--dim2);flex:none}
details.row[open]>summary{border-bottom:1px solid var(--line)}
details.row .in{padding:15px 0 17px}

/* nested disclosure — "more context", used inside rows and steps */
details.more{margin:11px 0 0;border-top:1px dashed var(--line);padding-top:9px}
details.more>summary{cursor:pointer;list-style:none;font:12px var(--f-ui);color:var(--acc)}
details.more>summary::before{content:"\25B8 ";display:inline-block;width:1.1em;
  transition:transform .12s}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more .in{padding:8px 0 2px;font-size:.95em;color:var(--dim)}
details.more .in b{color:var(--fg)}

/* ── tables ───────────────────────────────────────────────────────────────── */
table{border-collapse:collapse;width:100%;margin:12px 0;font:13.5px/1.55 var(--f-ui)}
th,td{padding:7px 10px;text-align:left;vertical-align:top;
  border:var(--grid) solid var(--line);border-bottom:1px solid var(--line)}
th{background:var(--panel2);color:var(--dim);font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.45px;border-top:1px solid var(--line2)}
tbody tr:nth-child(even) td{background:var(--zebra)}
td code{font-size:12px}

/* ── callout boxes ────────────────────────────────────────────────────────── */
.box{border:1px solid var(--line);border-left:3px solid var(--line2);
  border-radius:var(--r2);padding:11px 15px;margin:13px 0;background:var(--panel2)}
.box.key{border-left-color:var(--acc);background:var(--accbg)}
.box.ok{border-left-color:var(--ok);background:var(--okbg)}
.box.warn{border-left-color:var(--warn);background:var(--warnbg)}
.box.bad{border-left-color:var(--bad);background:var(--badbg)}
.box p:first-child{margin-top:0} .box p:last-child{margin-bottom:0}

/* ── command block ────────────────────────────────────────────────────────── */
.cmd{position:relative;background:var(--sunk);border:1px solid var(--line);
  border-radius:var(--r2);padding:11px 14px}
.cmd .copy{position:absolute;top:6px;right:6px}
/* .cmd.fig — a figure, not a command: a JSON sample, a tree, a log excerpt.
   Dashed, so "you run this" and "you read this" do not look identical, and
   exempt from the paste-safety checks in flowviz-audit.py. */
.cmd.fig{border-style:dashed}
.copy{background:var(--panel2);color:var(--dim);border:1px solid var(--line);
  border-radius:4px;font:10.5px var(--f-ui);padding:2px 8px;cursor:pointer;white-space:nowrap}
.copy:hover{color:var(--fg);border-color:var(--acc)}
.expect{font:12.5px/1.55 var(--f-ui);color:var(--dim);margin:9px 0 0}
.expect b{color:var(--ok)} .expect i{color:var(--bad);font-style:normal}

/* ── LAYER 2/3 · playbook checklist ───────────────────────────────────────── */
.pb{border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);
  margin:14px 0;overflow:hidden}
.pb>.hd{display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  padding:11px 15px;border-bottom:1px solid var(--line);background:var(--panel2)}
.pb>.hd .t{font:600 13.5px var(--f-ui)}
.pb>.hd .prog{margin-left:auto;font:11.5px var(--f-mono);color:var(--dim)}
.pb>.hd .prog .f{color:var(--bad)}
.pb>.hd .prog .e{color:var(--warn)}
.pb .tgt{display:flex;align-items:center;gap:7px;font:11px var(--f-ui);color:var(--dim2);
  text-transform:uppercase;letter-spacing:.5px}
.pb .tgt input{background:var(--sunk);color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:2px 7px;font:12px var(--f-mono);width:190px;text-transform:none;
  letter-spacing:0}
.pb .tgt input:focus{outline:none;border-color:var(--acc)}

ol.steps{counter-reset:stp;list-style:none;margin:0;padding:0}
li.step{display:grid;grid-template-columns:20px 1fr auto;gap:0 11px;align-items:start;
  padding:9px 15px;border-bottom:1px solid var(--line);margin:0}
li.step:last-child{border-bottom:none}
li.step.dim{opacity:.45}
li.step>input.done{grid-column:1;margin:4px 0 0;transform:translateY(1px);cursor:pointer}
li.step>.sd{grid-column:2;min-width:0}
li.step>.ctr{grid-column:3;display:flex;align-items:center;gap:7px;padding-top:2px;flex:none}
li.step>.sd>summary{cursor:pointer;list-style:none;outline:none;display:flex;gap:9px;
  align-items:baseline;padding:1px 0}
li.step>.sd>summary .n::before{counter-increment:stp;content:counter(stp);
  font:700 12px var(--f-ui);color:var(--acc)}
li.step>.sd>summary .n{min-width:1.2em;flex:none}
li.step>.sd>summary .ds{flex:1;line-height:1.45;font-size:.97em}
li.step.done>.sd>summary .ds{color:var(--dim2);text-decoration:line-through}
li.step>.sd .in{padding:10px 0 6px 0;margin-left:2.1em;border-top:1px dotted var(--line);
  margin-top:8px}
/* `Done ☐`, injected by flow.js at the foot of every step — where the work ends,
   so nobody scrolls back up to the row header to say they finished. Pressing it
   pops ✅ in place of the box, then the step folds away 300ms later. */
li.step .in .fin{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:12px;padding-top:9px;border-top:1px dotted var(--line)}
li.step .in .fin button.fd{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font:600 11.5px var(--f-ui);letter-spacing:.55px;text-transform:uppercase;color:var(--dim);
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);
  padding:5px 12px;line-height:1}
li.step .in .fin button.fd:hover{color:var(--fg);border-color:var(--acc)}
li.step .in .fin button.fd:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
li.step .in .fin button.fd .bx{font:13px/1 var(--f-mono);display:inline-block;width:1.15em;
  text-align:center}
li.step .in .fin button.fd.on{color:var(--ok);border-color:var(--ok)}
/* the tick lands before the collapse, so the state change is seen, not inferred */
@keyframes fvtick{
  0%{transform:scale(.3) rotate(-14deg);opacity:0}
  55%{transform:scale(1.35) rotate(0);opacity:1}
  100%{transform:scale(1)}
}
li.step .in .fin button.fd .bx.pop{animation:fvtick 260ms cubic-bezier(.2,1.3,.4,1) both}

/* min-width holds the column still through the longest label, "no match" */
.vd{font:700 10px var(--f-ui);letter-spacing:.6px;text-transform:uppercase;color:var(--dim2);
  min-width:6em;text-align:right;white-space:nowrap}
.vd.pass{color:var(--ok)} .vd.fail{color:var(--bad)}
/* error is not fail: fail is evidence about the system, error about the playbook */
.vd.error{color:var(--warn)} .vd.saved{color:var(--dim)}

/* The same verdict again at the foot of the step, next to `Done` — once a capture
   is pasted the row header's chip is off the top of the screen, and pass/fail is
   what you scrolled down to read. Filled, not bare text, so it reads at a glance. */
.vd.vdf{min-width:0;text-align:left;font-size:10.5px;line-height:1;padding:5px 11px;
  border:1px solid var(--line);border-radius:999px;background:var(--panel2)}
.vd.vdf.pass{border-color:var(--ok);background:var(--okbg)}
.vd.vdf.fail{border-color:var(--bad);background:var(--badbg)}
.vd.vdf.error{border-color:var(--warn);background:var(--warnbg)}
.vd.vdf.saved{background:var(--sunk)}
/* one pulse when the verdict changes under your cursor — never on page load */
@keyframes fvvd{
  0%{transform:scale(.88);opacity:.35}
  60%{transform:scale(1.08);opacity:1}
  100%{transform:scale(1)}
}
.vd.vdf.fl{animation:fvvd 320ms cubic-bezier(.2,1.2,.4,1) both}

/* write-step gate */
.gate{display:flex;align-items:center;gap:8px;font:12px var(--f-ui);color:var(--bad);
  background:var(--badbg);border:1px solid var(--line);border-left:3px solid var(--bad);
  border-radius:var(--r2);padding:7px 11px;margin:0 0 10px}
.gate input{cursor:pointer;flex:none}
li.step[data-risk="w"]:not(.acked) .cmd pre{filter:blur(4.5px);user-select:none}
li.step[data-risk="w"]:not(.acked) .cmd .copy{opacity:.4;pointer-events:none}
/* the collapsed-row ⧉ stays clickable and is refused in JS, so it can say why */
li.step[data-risk="w"]:not(.acked)>.ctr .copy{opacity:.45}

/* ── capture box ──────────────────────────────────────────────────────────── */
.cap{margin-top:11px}
.cap .cl{display:flex;align-items:center;gap:9px;font:11px var(--f-ui);color:var(--dim2);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;flex-wrap:wrap}
.cap .cl .kp{font:11px var(--f-mono);color:var(--mag);text-transform:none;letter-spacing:0}
.cap textarea{width:100%;min-height:74px;resize:vertical;background:var(--sunk);
  color:var(--fg);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px;
  font:12.5px/1.55 var(--f-mono)}
.cap textarea:focus{outline:none;border-color:var(--acc)}
.cap textarea::placeholder{color:var(--dim2);opacity:.65}
.cap .ft{display:flex;gap:13px;align-items:center;margin-top:6px;font:11.5px var(--f-ui);
  color:var(--dim2);flex-wrap:wrap}
.cap .ft input.ec{width:54px;background:var(--sunk);color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:2px 6px;font:12px var(--f-mono)}
.cap .ft .rn{font:10.5px var(--f-mono);color:var(--mag);letter-spacing:.3px}
.cap .ft button.rr{margin-left:auto;background:var(--panel2);color:var(--dim);
  border:1px solid var(--line);border-radius:4px;font:10.5px var(--f-ui);
  padding:2px 8px;cursor:pointer;white-space:nowrap}
.cap .ft button.rr:disabled{opacity:.35;cursor:default}
.cap .ft button.rr:not(:disabled):hover{color:var(--fg);border-color:var(--acc)}

/* one-line note — the only free text in a step, and it lands in the evidence file */
.cap input.nt{width:100%;margin-top:7px;background:var(--sunk);color:var(--fg);
  border:1px solid var(--line);border-radius:var(--r2);padding:5px 10px;font:12.5px var(--f-ui)}
.cap input.nt:focus{outline:none;border-color:var(--acc)}
.cap input.nt::placeholder{color:var(--dim2);opacity:.65}

/* ── checkboxes, phases ───────────────────────────────────────────────────── */
label.chk{display:block;padding:5px 0;cursor:pointer;font-size:.97em}
label.chk input{margin-right:9px;transform:translateY(1px)}
label.chk input:checked+span{color:var(--dim2);text-decoration:line-through}
.phase{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2);
  padding:12px 16px;margin:11px 0}
.phase .ph{font:700 11.5px var(--f-ui);letter-spacing:.75px;text-transform:uppercase;
  color:var(--mag);margin-bottom:2px}
.phase .pt{font-weight:600;margin-bottom:7px}

/* ── footer stamp ─────────────────────────────────────────────────────────── */
.foot{margin-top:36px;padding-top:13px;border-top:1px solid var(--line2);
  font:11.5px/1.8 var(--f-ui);color:var(--dim2)}
.foot .v{color:var(--acc);font-weight:700}
.foot .rb{margin-top:6px}
.foot .inl{display:inline-flex;align-items:center;gap:7px;background:var(--sunk);
  border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin-left:4px}

/* ── audit panel (?audit=1) ───────────────────────────────────────────────── */
.audit{position:fixed;bottom:12px;left:12px;z-index:60;width:352px;max-height:64vh;
  overflow:auto;background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);
  padding:11px 13px;font:11.5px/1.5 var(--f-ui);box-shadow:var(--sh-pop)}
.audit h4{margin:0 0 8px;font:700 11px var(--f-ui);letter-spacing:.9px;text-transform:uppercase;
  color:var(--dim2)}
.audit table{margin:0;font-size:11.5px}
.audit th,.audit td{padding:3px 6px}
.audit .p{color:var(--ok);font-weight:700} .audit .f{color:var(--bad);font-weight:700}
.audit .x{float:right;cursor:pointer;color:var(--dim2);border:none;background:none}

/* ── print ────────────────────────────────────────────────────────────────
   flow.js forces data-theme="light" and opens every <details> on beforeprint,
   then restores both afterwards — so print needs no palette of its own, only
   pagination and the few screen-only affordances turned off.               */
@media print{
  @page{margin:14mm}
  /* .fin repeats the row header's done-box and verdict chip, and paper does not
     scroll — one tick mark and one verdict per step is enough */
  .pill,.ctl,.audit,.copy,.gate,.rr,.fin{display:none!important}
  body{background:var(--print-bg);padding:0;max-width:none;font-size:10.5pt}
  .card,.dia,.box,.cmd,li.step,.phase,.foot,tr{break-inside:avoid}
  .card{box-shadow:none;break-after:avoid}
  details.row{background:var(--print-bg);box-shadow:none}
  details.row>summary,li.step>.sd>summary,h3,.pb>.hd{break-after:avoid}
  thead{display:table-header-group}
  /* the blur on a write command is a screen guard; on paper it is just damage */
  li.step[data-risk="w"]:not(.acked) .cmd pre{filter:none;user-select:auto}
  /* JS grows each textarea to its content first, so captures print in full */
  .cap textarea{overflow:visible;resize:none;min-height:0;background:var(--sunk);
    break-inside:avoid}
  .cap textarea::placeholder{color:transparent}
  .cap .ft input.ec{border:none;background:none;width:auto}
  a{color:inherit;text-decoration:none}
}
@media (prefers-reduced-motion:reduce){
  details.more>summary::before{transition:none}
  /* the tick and the verdict still appear — only the motion is dropped */
  li.step .in .fin button.fd .bx.pop{animation:none}
  .vd.vdf.fl{animation:none}
}
@media (max-width:700px){
  body{padding:18px 16px 60px}
  .card h1{font-size:22px}
  li.step{grid-template-columns:20px 1fr;gap:0 9px}
  li.step>.ctr{grid-column:2;padding-top:6px}
  .pb .tgt input{width:140px}
}

/* ===========================================================================
   FLOW_VIZ — draw.css
   The drawing component, and the neutrals of a drawing page.
     Components read the core names from flow.css: canvas --paper, ink --fg,
     secondary --dim, tertiary --dim2, rules --line/--line2, fills --panel/--panel2/--sunk.
     Kind tints and flow accents live here. The selected flow's accent is --flow,
     set on each figure — never --acc, which is the page accent.
     On a report page a drawing takes the journal/traditional neutrals as they are;
     on a drawing page ([data-kind="drawing"]) the canvas/night palette replaces them.
   =========================================================================== */

/* ── component tokens · light ─────────────────────────────────────────────── */
:root{
  --client:#2F6FEB;  --client-bg:#EAF2FF;  --client-bd:#A7C3F4;
  --edge:#7048E8;    --edge-bg:#F2EDFF;    --edge-bd:#C5B4F4;
  --service:#16945A; --service-bg:#E7F6EE; --service-bd:#9FD4B8;
  --data:#D97A0B;    --data-bg:#FFF3E0;    --data-bd:#F0C27E;
  --stream:#D6336C;  --stream-bg:#FFEBF2;  --stream-bd:#F1A9C4;
  --ext:#5B6B82;     --ext-bg:#EFF2F6;     --ext-bd:#BAC4D2;
  --threat:#C92A2A;  --threat-bg:#FFEDED;  --threat-bd:#EC9A9A;
  --f1:#2F6FEB; --f2:#0C9A8A; --f3:#E0751B;
  --on-tint:#FFFFFF;
  --d-sh:0 1px 2px rgba(23,32,51,.06),0 6px 18px rgba(23,32,51,.06);
  --d-node-sh:drop-shadow(0 1px 1px rgba(23,32,51,.07)) drop-shadow(0 4px 8px rgba(23,32,51,.05));
  --d-drawer-sh:-14px 0 40px rgba(10,15,29,.14);
  --d-scrim:rgba(23,32,51,.18);
  --d-ease:cubic-bezier(.22,1,.36,1);
}

/* ── component tokens · dark ──────────────────────────────────────────────── */
[data-theme="dark"]{
  --client:#72A9FF;  --client-bg:#12213F;  --client-bd:#2D5AA8;
  --edge:#AC96FF;    --edge-bg:#1E1842;    --edge-bd:#5641B0;
  --service:#52D597; --service-bg:#0D2A20; --service-bd:#22704D;
  --data:#FFB54D;    --data-bg:#2E210C;    --data-bd:#86560F;
  --stream:#FF7DB0;  --stream-bg:#331225;  --stream-bd:#932C59;
  --ext:#9DAAC3;     --ext-bg:#18202F;     --ext-bd:#3B4966;
  --threat:#FF6B6B;  --threat-bg:#35151A;  --threat-bd:#A83D45;
  --f1:#6EA6FF; --f2:#36D6C1; --f3:#FFA652;
  --on-tint:#0A0F1D;
  --d-sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --d-node-sh:drop-shadow(0 2px 6px rgba(0,0,0,.35));
  --d-drawer-sh:-14px 0 40px rgba(0,0,0,.45);
  --d-scrim:rgba(0,0,0,.45);
}

/* ── a drawing page · canvas (light) ──────────────────────────────────────── */
[data-kind="drawing"]{
  --bg:#F5F7FB; --paper:#FFFFFF; --panel:#FFFFFF; --panel2:#F1F4F9; --sunk:#F6F8FB;
  --line:#E2E7EF; --line2:#C9D2DF; --rule:#C9D2DF;
  --fg:#172033; --dim:#4A5568; --dim2:#7B8698;
  --acc:#2F6FEB; --ok:#16945A; --warn:#B7791F; --bad:#E03131; --mag:#7048E8;
  --accbg:#EAF2FF; --okbg:#E7F6EE; --warnbg:#FFF5E0; --badbg:#FDECEC; --magbg:#F2EDFF;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-ui:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-size:15px; --f-lh:1.55;
  --r:14px; --r2:9px;
  --sh:0 1px 2px rgba(23,32,51,.06),0 6px 18px rgba(23,32,51,.06);
  --grid:0;
}

/* ── a drawing page · night (dark) ────────────────────────────────────────── */
[data-kind="drawing"][data-theme="dark"]{
  --bg:#0A0F1D; --paper:#0F1628; --panel:#111A2D; --panel2:#172238; --sunk:#0C1324;
  --line:#223052; --line2:#33456B; --rule:#33456B;
  --fg:#E8EDF7; --dim:#AEB9CE; --dim2:#7D8BA6;
  --acc:#6EA6FF; --ok:#52D597; --warn:#FFB54D; --bad:#FF6262; --mag:#AC96FF;
  --accbg:#12213F; --okbg:#0D2A20; --warnbg:#2E210C; --badbg:#33141A; --magbg:#1E1842;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-size:15px; --f-lh:1.55;
  --r:14px; --r2:9px;
  --sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --grid:0;
}

/* ── drawing page frame ───────────────────────────────────────────────────── */
[data-kind="drawing"] body{max-width:none;padding:18px 24px 56px}
[data-kind="drawing"] body>main,.fv-page{max-width:1180px;margin:0 auto}
[data-kind="drawing"] .foot{max-width:1180px;margin-left:auto;margin-right:auto}

/* ── the figure ───────────────────────────────────────────────────────────── */
.fv-drawing{--flow:var(--f1);position:relative;margin:0;min-width:0}
.fv-drawing>.fv-depth,.fv-drawing>script{display:none!important}
.fv-drawing [hidden],.fv-drawer [hidden]{display:none!important}
:where(.fv-drawing) button{font:inherit;color:inherit}
.fv-drawing :focus-visible,.fv-drawer :focus-visible{outline:2px solid var(--flow,var(--acc));outline-offset:2px}

/* page mode: the claim first, nothing above it but where you are */
.fv-head{margin:0 0 4px}
.fv-hd-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:34px;padding-right:250px}
.fv-crumbs{display:flex;align-items:center;gap:8px;font:600 12.5px var(--f-ui);color:var(--dim2);flex-wrap:wrap}
.fv-crumbs .sep{opacity:.6}
.fv-crumbs button{background:none;border:none;padding:2px 4px;border-radius:6px;cursor:pointer;
  color:var(--f1);font:600 12.5px var(--f-ui);display:inline-flex;align-items:center;gap:4px}
.fv-crumbs button:hover{background:var(--panel2)}
.fv-crumbs button svg{width:12px;height:12px}
.fv-chip{display:inline-flex;align-items:center;gap:6px;font:700 10.5px var(--f-ui);
  letter-spacing:.9px;text-transform:uppercase;padding:4px 10px;border-radius:999px;
  color:var(--f1);background:color-mix(in srgb,var(--f1) 12%,var(--panel));
  border:1px solid color-mix(in srgb,var(--f1) 30%,transparent);white-space:nowrap}
.fv-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.fv-chip.seg{color:var(--stream);background:color-mix(in srgb,var(--stream) 12%,var(--panel));
  border-color:color-mix(in srgb,var(--stream) 30%,transparent)}
.fv-tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.fv-tbtn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;
  font:600 12px var(--f-ui);color:var(--dim);transition:border-color .15s,color .15s}
.fv-tbtn:hover{border-color:var(--line2);color:var(--fg)}
.fv-tbtn svg{width:14px;height:14px}
.fv-drawing h1.fv-title{font:700 30px/1.16 var(--f-ui);letter-spacing:-.4px;margin:14px 0 8px;
  max-width:34ch;text-wrap:balance;color:var(--fg)}
.fv-lede{margin:0;max-width:68ch;color:var(--dim);font:15.5px/1.55 var(--f-body);text-wrap:pretty}

/* figure mode: a caption, not a page header */
.fv-drawing figcaption.fv-fc{display:grid;gap:3px;margin:0 0 8px}
.fv-fc .fv-fc-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fv-fc .fv-chip{font-size:9.5px;padding:3px 8px}
.fv-fc-title{font:650 15px/1.35 var(--f-ui);color:var(--fg);text-wrap:balance}
.fv-fc-lede{margin:0;font:13px/1.5 var(--f-ui);color:var(--dim);max-width:72ch}
.fv-fc .fv-crumbs{font-size:12px}

/* ── strip: flows left, views right ───────────────────────────────────────── */
.fv-strip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 10px}
.fv-fc+.fv-strip{margin-top:6px}
.fv-flows{display:flex;gap:6px;flex-wrap:wrap}
.fv-flow{display:inline-flex;align-items:center;gap:8px;cursor:pointer;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;
  font:600 13px var(--f-ui);color:var(--dim);transition:all .16s var(--d-ease)}
.fv-flow:hover{color:var(--fg);border-color:var(--line2)}
.fv-flow .fd{width:9px;height:9px;border-radius:50%;background:var(--fc);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--fc) 20%,transparent)}
.fv-flow .n{font:600 11px var(--f-mono);color:var(--dim2)}
.fv-flow[aria-checked="true"]{color:var(--fg);border-color:var(--fc);
  background:color-mix(in srgb,var(--fc) 9%,var(--panel))}
.fv-flow:active{transform:scale(.97)}
.fv-views{margin-left:auto;display:inline-flex;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:3px;gap:2px}
.fv-views button{background:none;border:none;border-radius:7px;padding:5px 12px;cursor:pointer;
  font:600 12.5px var(--f-ui);color:var(--dim2)}
.fv-views button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--d-sh)}

/* ── stage: the canvas card ───────────────────────────────────────────────── */
.fv-stage{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:calc(var(--r) + 4px);box-shadow:var(--d-sh);overflow:hidden}
.fv-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.fv-grid{background-image:radial-gradient(color-mix(in srgb,var(--line) 88%,var(--paper)) 1px,transparent 1.2px);
  background-size:18px 18px;background-position:9px 9px}
.fv-map,.fv-seq{display:block;width:100%;height:auto;min-width:760px;user-select:none;-webkit-user-select:none}
.fv-wrap{position:relative;transition:transform .32s var(--d-ease),opacity .32s var(--d-ease)}
.fv-wrap.zoom-out{opacity:0;transform:scale(1.35)}
.fv-wrap.zoom-in-start{opacity:0;transform:scale(.8);transition:none}
.fv-wrap.zoom-back{opacity:0;transform:scale(.82)}
.fv-wrap.zoom-from-big{opacity:0;transform:scale(1.2);transition:none}

.fv-layers{position:absolute;top:10px;right:10px;z-index:5;display:flex;gap:5px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:3px}
.fv-layers button{display:inline-flex;align-items:center;gap:6px;background:none;border:none;
  border-radius:999px;padding:4px 10px;cursor:pointer;font:600 11.5px var(--f-ui);color:var(--dim2)}
.fv-layers button:hover{color:var(--fg)}
.fv-layers button[aria-pressed="true"]{color:var(--fg);background:var(--panel2)}
.fv-layers .sw{width:22px;height:12px;border-radius:999px;background:var(--line2);position:relative;
  transition:background .18s}
.fv-layers .sw::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;
  background:var(--paper);transition:transform .18s var(--d-ease)}
.fv-layers button[aria-pressed="true"] .sw{background:var(--f1)}
.fv-layers button[aria-pressed="true"] .sw::after{transform:translateX(10px)}

/* the rail: play, numbered steps, one caption */
.fv-rail{display:flex;align-items:center;gap:14px;padding:11px 14px;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--panel2) 60%,var(--paper));flex-wrap:wrap}
.fv-play{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:none;border-radius:999px;
  padding:7px 14px 7px 11px;font:700 12.5px var(--f-ui);color:var(--on-tint);background:var(--flow);
  transition:transform .12s,filter .15s;white-space:nowrap}
.fv-play:hover{filter:brightness(1.06)}
.fv-play:active{transform:scale(.97)}
.fv-play svg{width:14px;height:14px}
.fv-dots{display:flex;gap:5px;flex-wrap:wrap}
.fv-dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);background:var(--paper);
  font:700 11px/1 var(--f-ui);color:var(--dim2);cursor:pointer;display:grid;place-items:center;
  transition:all .18s var(--d-ease);padding:0}
.fv-dot:hover{border-color:var(--flow);color:var(--flow)}
.fv-dot.seen{border-color:color-mix(in srgb,var(--flow) 55%,transparent);color:var(--flow)}
.fv-dot.now{background:var(--flow);border-color:var(--flow);color:var(--on-tint);transform:scale(1.12)}
.fv-dot.fail.now{background:var(--bad);border-color:var(--bad)}
.fv-cap{flex:1 1 280px;margin:0;font:500 13.5px/1.45 var(--f-ui);color:var(--dim);min-height:20px}
.fv-cap b{color:var(--fg);font-weight:700}
.fv-more{background:none;border:none;padding:0 0 0 4px;color:var(--flow);cursor:pointer;font:600 12.5px var(--f-ui)}
.fv-navs{display:flex;gap:4px}
.fv-navs button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
  cursor:pointer;color:var(--dim);display:grid;place-items:center;padding:0}
.fv-navs button:hover{color:var(--fg);border-color:var(--line2)}
.fv-navs svg{width:14px;height:14px}

/* ── the peek: hover, one sentence, three facts at most ───────────────────── */
.fv-peek{position:absolute;z-index:20;width:268px;pointer-events:none;background:var(--panel);
  border:1px solid var(--line2);border-radius:12px;box-shadow:var(--d-sh);padding:11px 13px 10px;
  opacity:0;transform:translateY(4px) scale(.98);transform-origin:50% 100%;
  transition:opacity .14s var(--d-ease),transform .18s var(--d-ease)}
.fv-peek.on{opacity:1;transform:none}
.fv-peek.below{transform-origin:50% 0}
.fv-peek .pk{display:flex;align-items:center;gap:6px;font:700 10px var(--f-ui);letter-spacing:.9px;
  text-transform:uppercase;color:var(--k,var(--dim2))}
.fv-peek .pk::before{content:"";width:6px;height:6px;border-radius:2px;background:currentColor}
.fv-peek h4{margin:4px 0 3px;font:700 14.5px/1.25 var(--f-ui);color:var(--fg)}
.fv-peek p{margin:0;font:13px/1.45 var(--f-body);color:var(--dim)}
.fv-peek .facts{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.fv-peek .facts span{font:600 11px var(--f-mono);color:var(--fg);background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.fv-peek .hint{margin-top:9px;padding-top:7px;border-top:1px dashed var(--line);font:600 11px var(--f-ui);
  color:var(--dim2);display:flex;gap:10px}

/* ── the key: only when asked for ─────────────────────────────────────────── */
.fv-key{position:absolute;left:12px;bottom:64px;z-index:6;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--d-sh);padding:10px 12px;font:500 12px var(--f-ui);color:var(--dim);
  display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center;width:250px}
.fv-key svg{width:44px;height:14px;overflow:visible}

/* ── SVG: zones, boxes, connections ───────────────────────────────────────── */
.fv-drawing .zone rect{fill:color-mix(in srgb,var(--z) 5%,transparent);stroke:color-mix(in srgb,var(--z) 42%,transparent);
  stroke-width:1.3;stroke-dasharray:5 5}
.fv-drawing .zone text{fill:var(--z);font:700 11px var(--f-ui);letter-spacing:.4px}
.fv-drawing .z-neutral{--z:var(--dim2)} .fv-drawing .z-sync{--z:var(--f1)} .fv-drawing .z-async{--z:var(--stream)}
.fv-drawing .z-ext{--z:var(--ext)} .fv-drawing .z-data{--z:var(--data)} .fv-drawing .z-svc{--z:var(--service)}

.k-client{--k:var(--client);--k-bg:var(--client-bg);--k-bd:var(--client-bd)}
.k-edge{--k:var(--edge);--k-bg:var(--edge-bg);--k-bd:var(--edge-bd)}
.k-service{--k:var(--service);--k-bg:var(--service-bg);--k-bd:var(--service-bd)}
.k-data{--k:var(--data);--k-bg:var(--data-bg);--k-bd:var(--data-bd)}
.k-stream{--k:var(--stream);--k-bg:var(--stream-bg);--k-bd:var(--stream-bd)}
.k-external{--k:var(--ext);--k-bg:var(--ext-bg);--k-bd:var(--ext-bd)}
/* an adversary: never ours, so never drawn like ours — red, with a broken edge */
.k-threat{--k:var(--threat);--k-bg:var(--threat-bg);--k-bd:var(--threat-bd)}
.fv-drawing .node.k-threat .shape{stroke-dasharray:6 3}

.fv-drawing .node{cursor:pointer;transition:opacity .2s var(--d-ease)}
.fv-drawing .node .shape{fill:var(--k-bg);stroke:var(--k-bd);stroke-width:1.3;filter:var(--d-node-sh);
  transition:stroke .15s,stroke-width .15s}
.fv-drawing .node .tile{fill:var(--k)}
.fv-drawing .node .ico{color:var(--on-tint)}
.fv-drawing .node .lbl{fill:var(--fg);font:650 13px var(--f-ui);letter-spacing:-.1px}
.fv-drawing .node .tech{fill:var(--dim2);font:500 10.5px var(--f-ui);opacity:0;transition:opacity .2s}
.fv-drawing .node .lblg{transition:transform .22s var(--d-ease)}
.fv-drawing svg.show-labels .node .tech{opacity:1}
.fv-drawing svg.show-labels .node.has-tech .lblg{transform:translateY(-6px)}
.fv-drawing .node:hover .shape,.fv-drawing .node.sel .shape,.fv-drawing .node:focus-visible .shape{stroke:var(--k);stroke-width:2}
.fv-drawing .node:focus{outline:none}
.fv-drawing .node.sel .shape{stroke-width:2.4}
.fv-drawing .node.land .shape{stroke:var(--flow);stroke-width:2.6}
.fv-drawing .node.ghost .shape{fill:none;stroke:var(--line2);stroke-dasharray:4 4;filter:none}
.fv-drawing .node.ghost .tile{fill:var(--panel2)}
.fv-drawing .node.ghost .ico{color:var(--dim2)}
.fv-drawing .node.ghost .lbl{fill:var(--dim)}
.fv-drawing .node .seg{cursor:zoom-in}
.fv-drawing .node .seg circle{fill:var(--paper);stroke:var(--k);stroke-width:1.4}
.fv-drawing .node .seg path{stroke:var(--k);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fv-drawing .node .seg:hover circle{fill:var(--k)}
.fv-drawing .node .seg:hover path{stroke:var(--on-tint)}

.fv-drawing .edge .line{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-linecap:round;
  transition:stroke .2s,stroke-width .2s,opacity .2s}
.fv-drawing .edge.m-sync .line{stroke-dasharray:7 6}
.fv-drawing .edge.m-async .line{stroke-dasharray:.1 7;stroke-width:2.6}
.fv-drawing .edge .head{fill:var(--line2);transition:fill .2s}
.fv-drawing .edgeset .hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer;pointer-events:stroke}
.fv-drawing .edge{transition:opacity .2s var(--d-ease)}
.fv-drawing .edge.live .line{stroke:var(--flow);stroke-width:2}
.fv-drawing .edge.live.m-async .line{stroke-width:3}
.fv-drawing .edge.live .head{fill:var(--flow)}
.fv-drawing .edge.live.m-sync .line{animation:fv-march-s .9s linear infinite}
.fv-drawing .edge.live.m-async .line{animation:fv-march-a 1.3s linear infinite}
.fv-drawing .edge.live.rev .line{animation-direction:reverse}
.fv-drawing .edge.failing .line{stroke:var(--bad)}
.fv-drawing .edge.failing .head{fill:var(--bad)}
@keyframes fv-march-s{to{stroke-dashoffset:-13}}
@keyframes fv-march-a{to{stroke-dashoffset:-7.1}}
.fv-drawing .edgeset.hov .edge .line,.fv-drawing .edgeset.sel .edge .line{stroke-width:2.8}

.fv-drawing .chiplbl{opacity:0;transition:opacity .18s;pointer-events:none}
.fv-drawing .chiplbl rect{fill:var(--paper);stroke:var(--line2);stroke-width:1}
.fv-drawing .chiplbl text{fill:var(--dim);font:600 10.5px var(--f-mono)}
.fv-drawing svg.show-labels .chiplbl,.fv-drawing svg.show-times .chiplbl{opacity:1}
.fv-drawing .edgeset.hov .chiplbl,.fv-drawing .edgeset.sel .chiplbl,.fv-drawing svg.focus .edgeset.near .chiplbl{opacity:1}
.fv-drawing svg.focus .edgeset:not(.near) .chiplbl,.fv-drawing svg.stepping .edgeset:not(.hot) .chiplbl{opacity:0}

.fv-drawing .stepno{cursor:pointer}
.fv-drawing .stepno circle{fill:var(--flow);stroke:var(--paper);stroke-width:2.5}
.fv-drawing .stepno text{fill:var(--on-tint);font:800 10.5px var(--f-ui);letter-spacing:0;text-anchor:middle;
  dominant-baseline:central;pointer-events:none}
.fv-drawing .stepno.fail circle{fill:var(--bad)}
.fv-drawing .stepno.now circle{animation:fv-beat 1.2s var(--d-ease) infinite}
@keyframes fv-beat{0%,100%{stroke-width:2.5}50%{stroke-width:5.5}}

/* focus + context: a hover or a step dims everything it does not touch */
.fv-drawing svg.focus .node:not(.near),.fv-drawing svg.focus .edge:not(.near),.fv-drawing svg.focus .stepno:not(.near){opacity:.2}
.fv-drawing svg.stepping .node:not(.hot),.fv-drawing svg.stepping .edge:not(.hot),.fv-drawing svg.stepping .stepno:not(.hot){opacity:.18}
.fv-drawing svg.stepping .edge.hot .line{stroke:var(--flow);stroke-width:2.8}
.fv-drawing svg.stepping .edge.hot.failing .line{stroke:var(--bad)}
.fv-drawing svg.stepping .zone{opacity:.55}

/* the packet: what moves is what matters */
.fv-drawing .pkt .halo{fill:var(--flow);opacity:.22}
.fv-drawing .pkt .core{fill:var(--flow);stroke:var(--paper);stroke-width:2}
.fv-drawing .pkt.fail .halo,.fv-drawing .pkt.fail .core{fill:var(--bad)}
.fv-drawing .ptag rect{fill:var(--fg)}
.fv-drawing .ptag text{fill:var(--paper);font:700 10.5px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.fv-drawing .burst{fill:none;stroke:var(--bad);stroke-width:2;animation:fv-burst .5s var(--d-ease) forwards}
@keyframes fv-burst{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
.fv-drawing .xmark{animation:fv-xin .28s var(--d-ease) both}
.fv-drawing .xmark path{stroke:var(--bad);stroke-width:2.6;stroke-linecap:round}
.fv-drawing .xmark circle{fill:var(--paper);stroke:var(--bad);stroke-width:1.6}
@keyframes fv-xin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}

/* ── sequence view ────────────────────────────────────────────────────────── */
.fv-seq .life{stroke:var(--line2);stroke-width:1.2;stroke-dasharray:3 5}
.fv-seq .band{fill:transparent}
.fv-seq .band.now{fill:color-mix(in srgb,var(--flow) 9%,transparent)}
.fv-seq .msg .line{fill:none;stroke:var(--dim);stroke-width:1.6}
.fv-seq .msg.response .line{stroke-dasharray:6 5}
.fv-seq .msg.event .line{stroke-dasharray:.1 6;stroke-width:2.6;stroke-linecap:round}
.fv-seq .msg .head{fill:var(--dim)}
.fv-seq .msg.fail .line{stroke:var(--bad)} .fv-seq .msg.fail .head{fill:var(--bad)}
.fv-seq .msg text{fill:var(--dim);font:600 11px var(--f-mono);text-anchor:middle}
.fv-seq .msg.now .line{stroke:var(--flow);stroke-width:2.4}
.fv-seq .msg.now .head{fill:var(--flow)}
.fv-seq .msg.now text{fill:var(--fg)}
.fv-seq .msg.now.fail .line{stroke:var(--bad)}

/* ── spec view ────────────────────────────────────────────────────────────── */
.fv-specwrap{padding:16px 18px 18px;display:grid;gap:10px}
.fv-specwrap .fv-note{margin:0;font:500 13px/1.5 var(--f-ui);color:var(--dim)}
.fv-code{position:relative;background:var(--sunk);border:1px solid var(--line);border-radius:12px}
.fv-code pre{margin:0;padding:14px 16px;overflow:auto;max-height:520px;font:12.5px/1.6 var(--f-mono);
  color:var(--fg);tab-size:2;white-space:pre}
.fv-code .fv-btn{position:absolute;top:8px;right:8px}
.j-k{color:var(--edge)} .j-s{color:var(--service)} .j-n{color:var(--data)} .j-p{color:var(--dim2)}
.fv-btn{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:7px;padding:3px 9px;cursor:pointer;font:600 11px var(--f-ui);color:var(--dim);white-space:nowrap}
.fv-btn:hover{color:var(--fg);border-color:var(--line2)}
.fv-btn:disabled{opacity:.4;cursor:default}
.fv-btn svg{width:12px;height:12px}

/* ── the drawer: layer 3, unlimited, one click away ───────────────────────── */
.fv-scrim{position:fixed;inset:0;background:var(--d-scrim);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:66}
.fv-drawer{position:fixed;top:0;right:0;bottom:0;z-index:70;width:min(440px,94vw);background:var(--panel);
  color:var(--fg);border-left:1px solid var(--line);box-shadow:var(--d-drawer-sh);display:flex;flex-direction:column;
  transform:translateX(104%);transition:transform .3s var(--d-ease),visibility 0s linear .3s;visibility:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font:14px/1.55 var(--f-body)}
.fv-drawer.on{transform:none;visibility:visible;transition:transform .3s var(--d-ease),visibility 0s}
:where(.fv-drawer) button{font:inherit;color:inherit}
.fv-drawer .dr-hd{display:flex;gap:12px;align-items:center;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.fv-drawer .dr-ico{width:40px;height:40px;border-radius:11px;background:var(--k,var(--f1));color:var(--on-tint);
  display:grid;place-items:center;flex:none}
.fv-drawer .dr-ico svg{width:22px;height:22px}
.fv-drawer .dr-ico b{font:800 17px var(--f-ui)}
.fv-drawer .dr-kind{margin:0;font:700 10px var(--f-ui);letter-spacing:1px;text-transform:uppercase;color:var(--k,var(--dim2))}
.fv-drawer h2{margin:1px 0 0;font:700 18px/1.2 var(--f-ui);color:var(--fg)}
.fv-drawer .dr-x{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;display:grid;place-items:center;color:var(--dim);flex:none;padding:0}
.fv-drawer .dr-x:hover{color:var(--fg);border-color:var(--line2)}
.fv-drawer .dr-x svg{width:16px;height:16px}
.fv-drawer .dr-body{overflow:auto;padding:16px 18px 28px;display:grid;gap:16px;align-content:start;font-size:14px}
.fv-drawer .dr-body p{margin:0}
.fv-drawer .dr-body section{display:grid;gap:12px}
.fv-drawer .dr-body .lead{font-size:14.5px;color:var(--fg)}
.fv-drawer .dr-body h3{margin:0 0 6px;font:700 10.5px var(--f-ui);letter-spacing:1px;text-transform:uppercase;color:var(--dim2)}
.fv-drawer .dr-body ul,.fv-drawer .dr-body ol{margin:0;padding-left:19px;display:grid;gap:5px}
.fv-drawer .dr-body table{margin:0;font-size:13px}
.fv-drawer .facts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.fv-drawer .facts-grid div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;
  font:600 12.5px var(--f-mono);color:var(--fg)}
.fv-drawer .steplist{list-style:none;padding:0;margin:0;gap:2px}
.fv-drawer .steplist li{margin:0}
.fv-drawer .steplist button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;
  border:1px solid transparent;border-radius:9px;padding:6px 8px;cursor:pointer;font:500 13px/1.4 var(--f-ui);color:var(--dim)}
.fv-drawer .steplist button:hover{background:var(--panel2);border-color:var(--line);color:var(--fg)}
.fv-drawer .steplist .num{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  background:var(--fc,var(--f1));color:var(--on-tint);font:800 10.5px var(--f-ui)}
.fv-drawer .steplist .num.fail{background:var(--bad)}
.fv-drawer .alsoin{font:500 12.5px var(--f-ui);color:var(--dim2)}
.fv-drawer .alsoin button{background:none;border:none;color:var(--f1);cursor:pointer;font:600 12.5px var(--f-ui);padding:0 3px}
.fv-drawer .alsoin button:hover{text-decoration:underline}
.fv-drawer .route{font:600 13px/1.6 var(--f-ui);color:var(--fg)}
.fv-drawer .route .arr{color:var(--dim2);padding:0 3px}
.fv-drawer .stepnav{display:flex;justify-content:space-between;gap:8px}
.fv-drawer .segbtn{display:flex;align-items:center;gap:10px;width:100%;cursor:pointer;text-align:left;
  background:color-mix(in srgb,var(--stream) 8%,var(--panel));border:1px dashed color-mix(in srgb,var(--stream) 45%,transparent);
  border-radius:12px;padding:10px 12px;font:600 13.5px var(--f-ui);color:var(--fg)}
.fv-drawer .segbtn small{display:block;font:500 12px var(--f-ui);color:var(--dim)}
.fv-drawer .segbtn:hover{border-style:solid}
.fv-drawer .segbtn svg{width:18px;height:18px;color:var(--stream);flex:none}
.fv-drawer .notebox textarea{width:100%;min-height:74px;resize:vertical;background:var(--sunk);color:var(--fg);
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:13px/1.5 var(--f-body)}
.fv-drawer .notebox textarea:focus{outline:none;border-color:var(--f1)}
.fv-drawer .notebox textarea::placeholder{color:var(--dim2);opacity:.75}
.fv-drawer .notebox .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;
  font:500 11.5px var(--f-mono);color:var(--dim2)}

.fv-toast{position:fixed;left:50%;bottom:22px;z-index:80;transform:translate(-50%,20px);opacity:0;
  background:var(--fg);color:var(--paper);border-radius:999px;padding:7px 14px;font:600 12.5px var(--f-ui);
  transition:all .22s var(--d-ease);pointer-events:none}
.fv-toast.on{opacity:1;transform:translate(-50%,0)}

/* the motion switch, when there is no pill to carry it */
.fv-motion svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.pill .fv-motion{display:inline-flex;align-items:center}
.pill .fv-motion[aria-pressed="false"]{color:var(--dim2)}

/* ── motion off: the system still reads, only the drift stops ─────────────── */
.still .fv-drawing .edge.live .line,.still .fv-drawing .stepno.now circle{animation:none!important}
@media (prefers-reduced-motion:reduce){
  .fv-drawing .edge.live .line,.fv-drawing .stepno.now circle{animation:none!important}
  .fv-drawer,.fv-wrap,.fv-peek,.fv-flow,.fv-dot{transition:none!important}
}

/* ── narrow: the canvas scrolls inside itself, the drawer becomes a sheet ─── */
.fv-print{display:none}
@media (max-width:760px){
  [data-kind="drawing"] body{padding:16px 16px 48px}
  .fv-hd-top{padding-right:0}
  .fv-drawing h1.fv-title{font-size:23px}
  .fv-views{margin-left:0}
  .fv-layers{position:static;margin:10px 10px 0;width:max-content;max-width:calc(100% - 20px);overflow-x:auto}
  .fv-drawer{top:auto;left:0;width:auto;max-height:82vh;border-left:none;border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;transform:translateY(104%)}
  .fv-drawer.on{transform:none}
  .fv-scrim.on{opacity:1;pointer-events:auto}
  .fv-key{bottom:auto;top:52px}
}

/* ── print: a still picture and the steps it walks ────────────────────────── */
@media print{
  .fv-tools,.fv-views,.fv-layers,.fv-play,.fv-navs,.fv-dots,.fv-drawer,.fv-scrim,.fv-peek,.fv-key,.fv-toast,.fv-strip .fv-flow[aria-checked="false"]{display:none!important}
  .fv-hd-top{padding-right:0}
  .fv-stage{box-shadow:none;break-inside:avoid}
  /* the title, the lede and the canvas are one figure: never let a page break separate them */
  figure.fv-drawing{break-inside:avoid}
  .fv-drawing>figcaption,.fv-drawing .fv-hd,.fv-drawing .fv-strip{break-after:avoid}
  .fv-drawing .edge .line,.fv-drawing .stepno circle{animation:none!important}
  .fv-drawing .pkt,.fv-drawing .ptag{display:none}
  .fv-map,.fv-seq{min-width:0}
  .fv-print{display:block;margin:12px 4px 0;padding-left:22px;font:10.5pt/1.5 var(--f-body);color:var(--fg)}
  .fv-print li{margin:3px 0}
}

</style>
</head>
<body>
<main>
<!-- A reference drawing: a whole system with three flows and one segment.
     Everything below is what an agent writes; the runtime does the rest. -->
<figure class="fv-drawing" data-mode="page">
<script type="application/json">
{
  "id": "checkout",
  "name": "Checkout",
  "title": "Checkout confirms in 300 ms because payment settles off the hot path",
  "lede": "Three services and one database transaction sit on the request path. The card charge and the receipt run from the event bus after the customer already has an order id.",
  "grid": {"cols": 5, "rows": 4},
  "zones": [
    {"id": "client", "label": "Client", "cols": [0, 0], "rows": [1, 1], "tone": "neutral"},
    {"id": "hot", "label": "Hot path · p99 300 ms", "cols": [1, 3], "rows": [0, 1], "tone": "sync"},
    {"id": "async", "label": "Settles async · seconds", "cols": [2, 3], "rows": [2, 3], "tone": "async", "tag": "tr"},
    {"id": "ext", "label": "External", "cols": [4, 4], "rows": [2, 2], "tone": "ext"}
  ],
  "nodes": [
    {"id": "web", "label": "Web & mobile", "kind": "client", "icon": "devices", "at": [0, 1], "tech": "React · Swift · Kotlin", "peek": "The storefront and apps. Every checkout call carries a fresh idempotency key, so a double tap never buys twice.", "facts": ["1.2k orders/min peak", "JWT · 15 min"]},
    {"id": "gw", "label": "API gateway", "kind": "edge", "icon": "gateway", "at": [1, 1], "tech": "Envoy", "peek": "Terminates TLS, verifies the JWT against cached signing keys and rate-limits each customer before anything reaches a service.", "facts": ["p99 4 ms", "100 req/s per user"]},
    {"id": "order", "label": "Order service", "kind": "service", "icon": "service", "at": [2, 1], "tech": "Go · 6 pods", "peek": "Owns the order lifecycle. It answers 202 as soon as the order and its event are committed together.", "facts": ["p99 200 ms", "6 pods"], "segment": "order-outbox"},
    {"id": "inv", "label": "Inventory", "kind": "service", "icon": "box", "at": [2, 0], "tech": "gRPC", "peek": "Holds a 10-minute soft reservation per line item, so two customers cannot both buy the last unit.", "facts": ["p99 45 ms", "50 ms timeout"]},
    {"id": "cache", "label": "Order cache", "kind": "data", "icon": "cache", "at": [3, 0], "tech": "Redis", "peek": "Cache-aside copy of recent orders. Status reads are served here and never touch the primary database.", "facts": ["hit rate 94%", "TTL 30 s"]},
    {"id": "db", "label": "Orders DB", "kind": "data", "icon": "db", "at": [3, 1], "tech": "Postgres 16", "peek": "The system of record. The order row and its outbox row are written in the same transaction.", "facts": ["p99 18 ms", "1 primary · 2 replicas"]},
    {"id": "bus", "label": "Event bus", "kind": "stream", "icon": "queue", "at": [2, 2], "tech": "Kafka", "peek": "Carries OrderPlaced, PaymentCaptured and PaymentFailed. Consumers retry on their own; nothing on the hot path waits for it.", "facts": ["3 topics", "7-day retention"]},
    {"id": "pay", "label": "Payment worker", "kind": "service", "icon": "card", "at": [3, 2], "tech": "Go · consumer", "peek": "Consumes OrderPlaced and charges the card, using the order id as the idempotency key.", "facts": ["3 retries, backoff", "3 s timeout"]},
    {"id": "psp", "label": "Card processor", "kind": "external", "icon": "bank", "at": [4, 2], "tech": "third-party PSP", "peek": "Authorizes and captures the charge. It is outside our control, so it is kept off the request path.", "facts": ["p99 1.4 s", "99.95% SLA"]},
    {"id": "notify", "label": "Notifications", "kind": "service", "icon": "bell", "at": [2, 3], "tech": "email · push", "peek": "Sends the receipt or the payment-failed prompt. It only ever reads events.", "facts": ["p50 6 s after order"]}
  ],
  "edges": [
    {"id": "web-gw", "from": "web", "to": "gw", "mode": "sync", "label": "HTTPS", "ms": "p99 80 ms RTT", "peek": "Public TLS 1.3 from the device to our edge. A retry reuses the same idempotency key."},
    {"id": "gw-order", "from": "gw", "to": "order", "mode": "sync", "label": "HTTP/2", "ms": "p99 4 ms", "peek": "Internal call carrying the verified customer id in a signed header."},
    {"id": "order-inv", "from": "order", "to": "inv", "mode": "sync", "label": "gRPC", "ms": "p99 45 ms", "peek": "Reserve or release stock. A 50 ms timeout keeps a slow inventory from slowing checkout."},
    {"id": "order-db", "from": "order", "to": "db", "mode": "sync", "label": "SQL", "ms": "p99 18 ms", "peek": "One transaction writes the order row and the outbox row, or neither."},
    {"id": "order-cache", "from": "order", "to": "cache", "mode": "sync", "label": "RESP", "ms": "p99 2 ms", "peek": "Status reads check here first; every state change rewrites the entry."},
    {"id": "order-bus", "from": "order", "to": "bus", "mode": "async", "both": true, "label": "events", "ms": "relay lag ~100 ms", "peek": "The outbox relay publishes OrderPlaced; the order service consumes payment results to confirm or cancel."},
    {"id": "bus-pay", "from": "bus", "to": "pay", "mode": "async", "both": true, "label": "events", "ms": "lag < 1 s", "peek": "The worker consumes OrderPlaced and publishes PaymentCaptured or PaymentFailed."},
    {"id": "pay-psp", "from": "pay", "to": "psp", "mode": "sync", "label": "HTTPS", "ms": "p99 1.4 s", "peek": "Charge request with an idempotency key, so a retry can never double-charge."},
    {"id": "bus-notify", "from": "bus", "to": "notify", "mode": "async", "label": "events", "ms": "lag < 1 s", "peek": "Receipts and failure notices, driven only by events."}
  ],
  "flows": [
    {
      "id": "place",
      "label": "Place order",
      "summary": "8 steps. The customer has an order id after step 4; steps 5 to 8 settle in the background.",
      "steps": [
        {"id": "p1", "path": ["web", "gw", "order"], "msg": "POST /orders", "say": "The app posts the cart; the gateway checks the token and rate limit, then routes it."},
        {"id": "p2", "path": ["order", "inv"], "msg": "Reserve", "say": "The order service reserves each line item in inventory, with a 50 ms timeout."},
        {"id": "p3", "path": ["order", "db"], "msg": "COMMIT", "say": "The order row and its OrderPlaced outbox row commit in one transaction."},
        {"id": "p4", "path": ["order", "gw", "web"], "msg": "202 Accepted", "say": "The customer gets 202 Accepted and an order id; the hot path ends here."},
        {"id": "p5", "path": ["order", "bus"], "msg": "OrderPlaced", "say": "The outbox relay publishes OrderPlaced to the event bus."},
        {"id": "p6", "path": ["bus", "pay"], "msg": "OrderPlaced", "say": "The payment worker consumes the event, long after the customer has moved on."},
        {"id": "p7", "path": ["pay", "psp"], "msg": "Charge", "say": "It charges the card, using the order id as the idempotency key."},
        {"id": "p8", "path": ["pay", "bus", "notify"], "msg": "PaymentCaptured", "say": "PaymentCaptured fans out: the order is confirmed and the receipt is sent."}
      ]
    },
    {
      "id": "status",
      "label": "Check status",
      "summary": "4 steps. 94% of reads end at the cache and never touch the database.",
      "steps": [
        {"id": "s1", "path": ["web", "gw", "order"], "msg": "GET /orders/:id", "say": "The app asks for the order status through the gateway."},
        {"id": "s2", "path": ["order", "cache"], "msg": "GET", "say": "The order service reads the cache first; a hit returns in about 2 ms."},
        {"id": "s3", "path": ["order", "db"], "msg": "SELECT", "say": "On a miss it reads a replica, then writes the result back with a 30 s TTL."},
        {"id": "s4", "path": ["order", "gw", "web"], "msg": "200 OK", "say": "The status goes back to the app: pending, confirmed or cancelled."}
      ]
    },
    {
      "id": "declined",
      "label": "Card declined",
      "summary": "5 steps. A failing card never blocks checkout; it cancels the order and tells the customer.",
      "steps": [
        {"id": "d1", "path": ["bus", "pay"], "msg": "OrderPlaced", "say": "The payment worker picks up OrderPlaced as usual."},
        {"id": "d2", "path": ["pay", "psp"], "msg": "Charge", "fail": true, "say": "The processor declines the card, or times out after 3 s on every retry."},
        {"id": "d3", "path": ["pay", "bus"], "msg": "PaymentFailed", "say": "The worker publishes PaymentFailed instead of retrying forever."},
        {"id": "d4", "path": ["bus", "order", "inv"], "msg": "Release", "say": "The order service cancels the order and releases the reserved stock."},
        {"id": "d5", "path": ["bus", "notify"], "msg": "PaymentFailed", "say": "The customer is asked to update their card; the order id stays valid."}
      ]
    }
  ],
  "segments": {
    "order-outbox": {
      "kind": "segment",
      "name": "Order service",
      "parent": "order",
      "title": "The order row and its event commit together, or neither does",

<div class="fv-depth" hidden>
<section data-for="order">
  <h3>Latency budget, p99</h3>
  <table>
    <thead><tr><th>Stage</th><th>p99</th><th>Holds because</th></tr></thead>
    <tbody>
      <tr><td>Device → edge</td><td>80 ms</td><td>TLS resumed, HTTP/2 connection reused</td></tr>
      <tr><td>Gateway</td><td>4 ms</td><td>JWT keys cached; no call to the auth server</td></tr>
      <tr><td>Validate + price</td><td>60 ms</td><td>catalog prices cached in-process</td></tr>
      <tr><td>Inventory reserve</td><td>45 ms</td><td>50 ms timeout; on expiry the order is refused, not delayed</td></tr>
      <tr><td>Transaction</td><td>18 ms</td><td>two inserts and one commit on the primary</td></tr>
      <tr><td>Serialize + return</td><td>15 ms</td><td>response is an id and a status, nothing more</td></tr>
      <tr><td><b>Total</b></td><td><b>222 ms</b></td><td>78 ms of headroom under the 300 ms claim</td></tr>
    </tbody>
  </table>
  <div>
    <h3>What it deliberately does not do</h3>
    <ul>
      <li>Call the card processor. It is the one dependency with a p99 over a second.</li>
      <li>Publish to Kafka directly. A broker hiccup would otherwise fail a checkout that already committed.</li>
    </ul>
  </div>
</section>
<section data-for="db">
  <h3>The two tables that matter</h3>
  <div class="cmd fig"><pre><code>CREATE TABLE orders (
  id               uuid PRIMARY KEY,
  customer_id      uuid NOT NULL,
  status           text NOT NULL DEFAULT 'PENDING',
  idempotency_key  text NOT NULL UNIQUE,
  total_cents      bigint NOT NULL,
  created_at       timestamptz NOT NULL DEFAULT now()
);
CREATE TABLE outbox (
  id          bigserial PRIMARY KEY,
  topic       text NOT NULL,
  payload     jsonb NOT NULL,
  created_at  timestamptz NOT NULL DEFAULT now(),
  sent_at     timestamptz
);
CREATE INDEX outbox_unsent ON outbox (id) WHERE sent_at IS NULL;</code></pre></div>
  <p>Replicas serve status reads on a cache miss. Replication lag p99 is 40 ms, well inside the 30 s cache TTL.</p>
</section>
<section data-for="bus">
  <h3>Topics</h3>
  <table>
    <thead><tr><th>Topic</th><th>Producer</th><th>Consumers</th></tr></thead>
    <tbody>
      <tr><td><code>order.placed</code></td><td>outbox relay</td><td>payment worker</td></tr>
      <tr><td><code>payment.captured</code></td><td>payment worker</td><td>order service, notifications</td></tr>
      <tr><td><code>payment.failed</code></td><td>payment worker</td><td>order service, notifications</td></tr>
    </tbody>
  </table>
  <p>All three are keyed by order id, so every event for one order lands on one partition, in order.</p>
</section>
<section data-for="pay">
  <h3>Retry policy</h3>
  <ul>
    <li>3 attempts, backoff 1 s then 4 s, each with a 3 s timeout.</li>
    <li>The idempotency key is the order id, so attempt 3 can never create a second charge.</li>
    <li>A hard decline is not retried. Only timeouts and 5xx are.</li>
  </ul>
  <div class="cmd fig"><pre><code>charge, err := psp.Charge(ctx, psp.ChargeRequest{
    Amount:         order.TotalCents,
    Currency:       "USD",
    PaymentMethod:  order.PaymentMethodID,
    IdempotencyKey: order.ID.String(),
})</code></pre></div>
</section>
<section data-for="psp">
  <h3>How each answer lands</h3>
  <table>
    <thead><tr><th>Processor says</th><th>We do</th></tr></thead>
    <tbody>
      <tr><td>captured</td><td>publish <code>payment.captured</code></td></tr>
      <tr><td>declined</td><td>publish <code>payment.failed</code> at once; no retry</td></tr>
      <tr><td>timeout or 5xx</td><td>retry with the same key; after 3 attempts, publish <code>payment.failed</code></td></tr>
    </tbody>
  </table>
</section>
<section data-for="cache">
  <h3>Cache-aside, in five lines</h3>
  <div class="cmd fig"><pre><code>func Status(id string) (Order, error) {
    if o, ok := cache.Get("order:" + id); ok { return o, nil }
    o, err := replica.GetOrder(id)
    if err == nil { cache.Set("order:"+id, o, 30*time.Second) }
    return o, err
}</code></pre></div>
  <p>Every status change also deletes the key, so the 30 s TTL is a backstop, not the freshness guarantee.</p>
</section>
<section data-for="gw">
  <h3>Rate limit</h3>
  <p>Token bucket per customer id: 100 requests per second, burst 20. <code>POST /orders</code> has its own bucket of 5 per minute, which stops a stuck retry loop from creating a storm of orders.</p>
</section>
<section data-for="edge:order-bus">
  <h3>Why two lanes</h3>
  <p>This connection carries traffic both ways. The order service <b>publishes</b> through the outbox relay and <b>consumes</b> payment results to confirm or cancel. Each direction is drawn as its own lane, so the motion never has to lie about direction.</p>
</section>
<section data-for="step:p3">
  <div class="cmd fig"><pre><code>BEGIN;
INSERT INTO orders (id, customer_id, idempotency_key, total_cents)
  VALUES ($1, $2, $3, $4);
INSERT INTO outbox (topic, payload)
  VALUES ('order.placed', $5);
COMMIT;</code></pre></div>
  <p>If either insert fails, both roll back, so an event can never describe an order that does not exist.</p>
</section>
<section data-for="step:p4">
  <h3>Why 202, not 201</h3>
  <p>The order exists but is not paid. <code>202 Accepted</code> tells the client the work continues; the app shows "Order placed" and polls the status, which is the <b>Check status</b> flow.</p>
</section>
<section data-for="step:d2">
  <h3>Worst case, in time</h3>
  <p>Three attempts at a 3 s timeout, plus 1 s and 4 s of backoff, is 14 s before <code>payment.failed</code>. The customer left the checkout screen about 13.7 s earlier.</p>
</section>
<section data-for="order-outbox/relay">
  <div class="cmd fig"><pre><code>SELECT id, topic, payload
  FROM outbox
 WHERE sent_at IS NULL
 ORDER BY id
 LIMIT 100
   FOR UPDATE SKIP LOCKED;</code></pre></div>
  <p><code>SKIP LOCKED</code> lets several relay replicas run without publishing the same row twice. A crash after publishing but before <code>sent_at</code> is set produces one duplicate, which consumers already ignore by order id.</p>
</section>
<section data-for="order-outbox/api">
  <h3>Idempotency</h3>
  <p>The <code>Idempotency-Key</code> header is stored in <code>orders.idempotency_key</code>. A second request with the same key hits the unique index, and the handler returns the first order's 202 instead of creating another.</p>
</section>
<section data-for="order-outbox/outbox">
  <h3>Row lifecycle</h3>
  <ol>
    <li>Inserted with <code>sent_at = NULL</code>, inside the order's transaction.</li>
    <li>Locked and published by the relay.</li>
    <li><code>sent_at</code> set; rows older than 7 days are deleted nightly.</li>
  </ol>
</section>
</div>
